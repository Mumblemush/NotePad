# Project-wide Gradle settings.
# 这里不写死 JDK 路径：换台机器（评阅环境）也能直接构建。
# 需要指定 JDK 时，命令行用 JAVA_HOME，Android Studio 用 Settings → Gradle → Gradle JDK 选 17 以上。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle 9.5 配置缓存在 IDE 下与 AGP 9.3 存在兼容问题（processDebugResources 崩溃），关闭
org.gradle.configuration-cache=false
